name: Keep Supabase Alive

# Este workflow hace varias peticiones reales a la base de datos de Supabase
# varias veces al día para evitar que el proyecto se pause por inactividad
# en el plan gratuito. Supabase evalúa la actividad de la última semana y
# recomienda "unas pocas peticiones cada día", así que una llamada cada
# 3 días ya no es suficiente.

on:
  schedule:
    # 4 veces al día (cada 6 horas, en el minuto 17 para evitar los
    # retrasos de GitHub en las horas en punto). Horario en UTC.
    - cron: "17 */6 * * *"
  workflow_dispatch: {} # permite lanzarlo manualmente desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase table to generate activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role (a.k.a. "secret key" en el dashboard nuevo de Supabase):
          # ignora RLS y grants por tabla, así que no depende de permisos del
          # rol anon. Nunca se expone al cliente, solo vive como secret de CI.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_TABLE: "quiz_submissions"
        run: |
          # Varias consultas por ejecución para generar algo más de actividad.
          for i in 1 2 3; do
            response=$(curl -s -o /tmp/response.json -w "%{http_code}" \
              "${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?select=id&limit=1" \
              -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}")

            echo "Intento $i - HTTP status: $response"

            if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
              cat /tmp/response.json
              echo "Error al contactar con Supabase (status $response)."
              exit 1
            fi

            sleep 5
          done

          echo "Supabase respondió correctamente. Proyecto activo."